spring:
  application:
    name: fake-data-generator

  datasource:
    url: jdbc:h2:mem:fdg;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      properties:
        linger.ms: 10
        batch.size: 32768

server:
  port: 8080

logging:
  level:
    com.fdg: INFO
    org.apache.kafka: WARN

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fdg}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:fdg}
    password: ${DB_PASSWORD:fdg}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
